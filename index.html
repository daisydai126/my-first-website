
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Issue Tracker</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #1e293b;
  margin: 0;
}

header {
  background: #1e293b;
  color: white;
  padding: 24px;
}

h1 {
  margin: 0;
}

.subtitle {
  color: #cbd5e1;
  margin-bottom: 0;
}

main {
  max-width: 950px;
  margin: 30px auto;
  padding: 0 18px;
}

/* Statistics */
.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 24px;
}

.card,
.panel {
  background: white;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 2px 8px #0000000a;
}

.card strong {
  display: block;
  font-size: 30px;
  margin-top: 10px;
}

/* Input and buttons */
.toolbar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

input,
select,
button {
  padding: 10px;
  border: 1px solid #cbd5e1;
  border-radius: 7px;
  font-size: 14px;
}

input {
  flex: 1;
  min-width: 160px;
}

button {
  background: #2563eb;
  color: white;
  border: none;
  cursor: pointer;
}

button:hover {
  background: #1d4ed8;
}

.delete {
  background: #dc2626;
}

.delete:hover {
  background: #b91c1c;
}

/* Search and filter */
.filter-section {
  border-top: 1px solid #e2e8f0;
  padding-top: 20px;
  margin-bottom: 20px;
}

.filter-section h3 {
  margin-top: 0;
}

.filter-toolbar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.filter-toolbar input {
  flex: 2;
}

.filter-toolbar select {
  flex: 1;
  min-width: 150px;
}

.results-count {
  margin-top: 15px;
  font-size: 14px;
  color: #64748b;
}

/* Issue list */
.issue {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  border-bottom: 1px solid #e2e8f0;
  padding: 15px 0;
}

.issue:last-child {
  border: 0;
}

.issue-info {
  min-width: 0;
  overflow-wrap: anywhere;
}

.issue small {
  color: #64748b;
}

.actions {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}

/* Priority labels */
.priority-high {
  color: #dc2626;
  font-weight: bold;
}

.priority-medium {
  color: #d97706;
  font-weight: bold;
}

.priority-low {
  color: #16a34a;
  font-weight: bold;
}

.empty-message {
  color: #64748b;
  text-align: center;
  padding: 20px;
}

/* Mobile responsive */
@media (max-width: 650px) {
  .stats {
    grid-template-columns: repeat(2, 1fr);
  }

  .card {
    padding: 15px;
  }

  .card strong {
    font-size: 26px;
  }

  .issue {
    align-items: flex-start;
    flex-direction: column;
  }

  .toolbar,
  .filter-toolbar {
    flex-direction: column;
  }

  .toolbar input,
  .toolbar select,
  .toolbar button,
  .filter-toolbar input,
  .filter-toolbar select {
    width: 100%;
    min-width: 0;
  }

  .actions {
    width: 100%;
  }
}
</style>
</head>

<body>

<header>
  <h1>Project Issue Tracker</h1>
  <p class="subtitle">My first AI-powered website</p>
</header>

<main>

<!-- Statistics -->
<section class="stats">
  <div class="card">
    Total
    <strong id="total">0</strong>
  </div>

  <div class="card">
    Open
    <strong id="open">0</strong>
  </div>

  <div class="card">
    In Progress
    <strong id="progress">0</strong>
  </div>

  <div class="card">
    Closed
    <strong id="closed">0</strong>
  </div>
</section>

<!-- Issue management -->
<section class="panel">

  <h2>Issue List</h2>

  <!-- Add Issue -->
  <div class="toolbar">
    <input
      id="title"
      maxlength="120"
      placeholder="Enter issue title"
    >

    <select id="priority">
      <option>Medium</option>
      <option>High</option>
      <option>Low</option>
    </select>

    <button onclick="addIssue()">
      Add Issue
    </button>
  </div>

  <!-- Search and Priority Filter -->
  <div class="filter-section">

    <h3>Search & Filter Issues</h3>

    <div class="filter-toolbar">

      <input
        id="search"
        type="search"
        placeholder="Search issues by title..."
        oninput="render()"
      >

      <select
        id="priorityFilter"
        onchange="render()"
      >
        <option value="All">All Priorities</option>
        <option value="High">High</option>
        <option value="Medium">Medium</option>
        <option value="Low">Low</option>
      </select>

    </div>

    <div class="results-count">
      Filtered Results:
      <strong id="filteredCount">0</strong>
      issues
    </div>

  </div>

  <!-- Issue list -->
  <div id="issues"></div>

</section>

</main>

<script>

/* Local Storage */
const key = "my-issue-tracker-v1";

let items;

try {
  items = JSON.parse(localStorage.getItem(key)) || [];
} catch (e) {
  items = [];
}

if (!Array.isArray(items)) {
  items = [];
}

/* Save data */
function save() {
  localStorage.setItem(key, JSON.stringify(items));
}

/* Add Issue */
function addIssue() {

  const input = document.getElementById("title");
  const title = input.value.trim();

  if (!title) {
    alert("Please enter an issue title.");
    return;
  }

  items.push({
    id: Date.now() + Math.random(),
    title: title,
    priority: document.getElementById("priority").value,
    status: "Open"
  });

  input.value = "";

  save();
  render();
}

/* Update Issue Status */
function updateIssue(id, status) {

  const item = items.find(x => x.id === id);

  if (item) {
    item.status = status;
    save();
    render();
  }
}

/* Delete Issue */
function deleteIssue(id) {

  if (confirm("Delete this issue?")) {

    items = items.filter(x => x.id !== id);

    save();
    render();
  }
}

/* Filter Issues */
function getFilteredIssues() {

  const searchText = document
    .getElementById("search")
    .value
    .trim()
    .toLowerCase();

  const selectedPriority = document
    .getElementById("priorityFilter")
    .value;

  return items.filter(item => {

    const matchesSearch = item.title
      .toLowerCase()
      .includes(searchText);

    const matchesPriority =
      selectedPriority === "All" ||
      item.priority === selectedPriority;

    return matchesSearch && matchesPriority;

  });
}

/* Render Page */
function render() {

  /* Statistics: all issues */
  document.getElementById("total").textContent =
    items.length;

  document.getElementById("open").textContent =
    items.filter(x => x.status === "Open").length;

  document.getElementById("progress").textContent =
    items.filter(x => x.status === "In Progress").length;

  document.getElementById("closed").textContent =
    items.filter(x => x.status === "Closed").length;

  /* Apply filters */
  const filteredItems = getFilteredIssues();

  /* Filtered results count */
  document.getElementById("filteredCount").textContent =
    filteredItems.length;

  const list = document.getElementById("issues");

  list.replaceChildren();

  /* Empty state */
  if (filteredItems.length === 0) {

    const p = document.createElement("p");

    p.className = "empty-message";

    p.textContent = items.length === 0
      ? "No issues yet. Add your first issue!"
      : "No matching issues found.";

    list.append(p);
    return;
  }

  /* Display filtered issues */
  filteredItems.forEach(item => {

    const row = document.createElement("div");
    row.className = "issue";

    const info = document.createElement("div");
    info.className = "issue-info";

    const name = document.createElement("strong");
    name.textContent = item.title;

    const meta = document.createElement("small");

    const priorityLabel = document.createElement("span");
    priorityLabel.textContent = item.priority;

    priorityLabel.className =
      "priority-" + item.priority.toLowerCase();

    meta.append(
      document.createTextNode("Priority: "),
      priorityLabel
    );

    info.append(
      name,
      document.createElement("br"),
      meta
    );

    const actions = document.createElement("div");
    actions.className = "actions";

    /* Status selector */
    const select = document.createElement("select");

    ["Open", "In Progress", "Closed"].forEach(s => {

      const opt = document.createElement("option");

      opt.value = s;
      opt.textContent = s;
      opt.selected = s === item.status;

      select.append(opt);
    });

    select.addEventListener("change", () => {
      updateIssue(item.id, select.value);
    });

    /* Delete button */
    const del = document.createElement("button");

    del.className = "delete";
    del.textContent = "Delete";

    del.addEventListener("click", () => {
      deleteIssue(item.id);
    });

    actions.append(select, del);

    row.append(info, actions);

    list.append(row);

  });
}

/* Initial render */
render();

</script>

</body>
</html>
